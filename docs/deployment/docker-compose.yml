version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docs/deployment/Dockerfile
    container_name: space_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docs/deployment/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - space_network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: space_webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docs/deployment/07_nginx_configuration.conf:/etc/nginx/conf.d/default.conf
    networks:
      - space_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: space_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - space_network

  redis:
    image: redis:7.0-alpine
    container_name: space_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - space_network

  worker:
    build:
      context: .
      dockerfile: docs/deployment/Dockerfile
    container_name: space_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./:/var/www
    networks:
      - space_network
    depends_on:
      - redis
      - db

networks:
  space_network:
    driver: bridge

volumes:
  dbdata:
  redisdata:
